<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крути Карен! Альфа</title>
    <style>
        :root { --common: #808080; --rare: #1e3c72; --super: #ffd700; --secret: #0d0d0d; }
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; user-select: none; }
        #auth-screen { position: fixed; top:0; left:0; width:100vw; height:100vh; background: #0a0a0a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        #auth-screen input { padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid var(--rare); background: #222; color: #fff; text-align: center; margin-bottom: 15px; outline: none; }
        #auth-screen button { padding: 10px 25px; background: var(--rare); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .container { max-width: 800px; width: 100%; padding: 20px; box-sizing: border-box; text-align: center; }
        #admin-trigger { cursor: pointer; font-size: 14px; color: #555; }
        .balance-panel { font-size: 18px; margin: 15px 0; background: #1e1e1e; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .roulette-wrapper { position: relative; width: 100%; height: 130px; background: #1a1a1a; border: 3px solid #333; border-radius: 12px; overflow: hidden; margin: 25px 0; box-shadow: inset 0 0 20px #000; }
        .pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #ff3333; z-index: 10; box-shadow: 0 0 10px #ff3333; }
        .roulette-tape { display: flex; position: absolute; left: 0; top: 10px; height: 110px; will-change: transform; }
        .slot-card { width: 90px; height: 110px; margin: 0 5px; background: #252525; border-radius: 8px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; border-bottom: 5px solid #fff; }
        .slot-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
        .spin-btn { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 15px rgba(30,60,152,0.4); }
        .spin-btn:disabled { background: #444; cursor: not-allowed; box-shadow: none; }
        .bg-common { border-bottom-color: var(--common) !important; }
        .bg-rare { border-bottom-color: var(--rare) !important; }
        .bg-super { border-bottom-color: var(--super) !important; }
        .bg-secret { border-bottom-color: var(--secret) !important; background: #050505; }
        .inventory-header { text-align: left; margin-top: 40px; font-size: 20px; border-bottom: 2px solid #333; padding-bottom: 5px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; margin-top: 20px; }
        .inv-card { background: #1e1e1e; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; position: relative; border: 2px solid #333; }
        .inv-card img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; }
        .inv-card .name { font-size: 12px; margin-top: 8px; font-weight: bold; text-align: center; }
        .inv-card .count { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); padding: 2px 6px; font-size: 11px; border-radius: 5px; color: #ffd700; }
        #win-modal { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #222; padding: 30px; border-radius: 20px; text-align: center; border: 3px solid #fff; max-width: 300px; }
        .modal-content img { width: 180px; height: 180px; object-fit: cover; border-radius: 12px; }
        #admin-panel { display: none; background: #2c1a1a; border: 1px solid #ff5555; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .admin-btn { background: #ff5555; color: white; border: none; padding: 5px 10px; margin: 5px; cursor: pointer; border-radius: 5px;}
    </style>
</head>
<body>
    <div id="auth-screen">
        <h2 style="color: #ffd700; margin-bottom: 20px;">Крути Карен! Казино Чести</h2>
        <input type="password" id="pass-input" placeholder="Введи пароль чести">
        <button onclick="checkPassword()">Войти в пул</button>
    </div>
    <div class="container">
        <h1 onclick="adminClick()">Крути Карен!</h1>
        <div id="admin-trigger">Альфа версия (кликни 5 раз для админки)</div>
        <div class="balance-panel">🎰 Спины: <span id="balance-val">10</span> | 📦 В коллекции: <span id="col-val">0 / 7</span></div>
        <div class="roulette-wrapper"><div class="pointer"></div><div class="roulette-tape" id="tape"></div></div>
        <button class="spin-btn" id="spin-btn" onclick="startSpin()">ИСПЫТАТЬ ЧЕСТЬ</button>
        <div id="admin-panel">
            <h3>Панель Главврача (Админка)</h3>
            <button class="admin-btn" onclick="addSpins()">+100 Спинов</button>
            <button class="admin-btn" onclick="clearInv()">Сбросить инвентарь</button>
            <button class="admin-btn" onclick="toggleCheat()">Подкрутка на Секретку: <span id="cheat-status">ВЫКЛ</span></button>
        </div>
        <div class="inventory-header">Твой Инвентарь Каренов</div>
        <div class="inventory-grid" id="inventory"></div>
    </div>
    <div id="win-modal" onclick="closeModal()">
        <div class="modal-content" id="modal-content">
            <h2 id="win-tier" style="margin-top:0;">ВЫПАЛ!</h2>
            <img id="win-img" src="" alt="">
            <h3 id="win-name">Название</h3>
            <p style="color: #888; font-size: 12px;">Кликни в любое место, чтобы закрыть</p>
        </div>
    </div>
    <script>
        const KARENS = [
            { id: 'common_karen', name: 'Обычный Карен', tier: 'common', img: 'https://i.yapx.ru/eS6WKb.jpg' },
            { id: 'alparen', name: 'Карен-альпарен', tier: 'rare', img: 'https://i.yapx.ru/eS6WDb.jpg' },
            { id: 'karamelka', name: 'Каренка карамелька', tier: 'rare', img: 'https://i.yapx.ru/eS6V1b.jpg' },
            { id: 'boxren', name: 'Карен Боксрен', tier: 'rare', img: 'https://i.yapx.ru/eS6VJb.jpg' },
            { id: 'dobren', name: 'Добрен', tier: 'super', img: 'https://i.yapx.ru/eS6U4b.jpg' },
            { id: 'zloren', name: 'Злорен', tier: 'super', img: 'https://i.yapx.ru/eS6Uvb.jpg' },
            { id: 'golden_karen', name: 'Golden Karen', tier: 'secret', img: 'https://i.yapx.ru/eS6Vib.jpg' }
        ];
        let balance = 10;
        let inventory = {};
        let adminClicks = 0;
        let cheatActive = false;

        function checkPassword() {
            if (document.getElementById('pass-input').value === 'karen2026') {
                document.getElementById('auth-screen').style.display = 'none';
                initGame();
            } else {
                alert('У тебя недостаточно чести! Ты каренус!');
            }
        }

        function initGame() {
            updateUI();
            buildTapePlaceholder();
        }

        function updateUI() {
            document.getElementById('balance-val').innerText = balance;
            let uniqueCount = inventory ? Object.keys(inventory).length : 0;
            document.getElementById('col-val').innerText = uniqueCount + " / " + KARENS.length;
            const grid = document.getElementById('inventory');
            if (grid) {
                grid.innerHTML = '';
                KARENS.forEach(function(k) {
                    if (inventory[k.id]) {
                        const card = document.createElement('div');
                        card.className = "inv-card bg-" + k.tier;
                        card.innerHTML = "<div class='count'>x" + inventory[k.id] + "</div><img src='" + k.img + "'><div class='name'>" + k.name + "</div>";
                        grid.appendChild(card);
                    }
                });
            }
        }

        function buildTapePlaceholder() {
            const tape = document.getElementById('tape');
            if (!tape) return;
            tape.style.transition = 'none';
            tape.style.transform = 'translateX(0px)';
            tape.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                tape.appendChild(createSlotCard(KARENS[Math.floor(Math.random() * KARENS.length)]));
            }
        }

        function createSlotCard(karen) {
            const card = document.createElement('div');
            card.className = "slot-card bg-" + karen.tier;
            card.innerHTML = "<img src='" + karen.img + "'>";
            return card;
        }

        function rollKaren() {
            if (cheatActive) return KARENS.find(k => k.id === 'golden_karen');
            const rand = Math.random() * 100;
            if (rand < 0.005) return KARENS.find(k => k.id === 'golden_karen');
            if (rand < 1.0) {
                const supers = KARENS.filter(k => k.tier === 'super');
                return supers[Math.floor(Math.random() * supers.length)];
            }
            if (rand < 40.0) {
                const rares = KARENS.filter(k => k.tier === 'rare');
                return rares[Math.floor(Math.random() * rares.length)];
            }
            return KARENS.find(k => k.id === 'common_karen');
        }

        function startSpin() {
            if (balance <= 0) {
                alert('Спины кончились!');
                return;
            }
            balance--;
            updateUI();
            document.getElementById('spin-btn').disabled = true;
            const tape = document.getElementById('tape');
            buildTapePlaceholder();
            const prizeKaren = rollKaren();
            const prizeIndex = 32;
            if (tape && tape.children[prizeIndex]) {
                tape.replaceChild(createSlotCard(prizeKaren), tape.children[prizeIndex]);
            }
            setTimeout(function() {
                tape.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
                const cardWidth = 100;
                const wrapperWidth = document.querySelector('.roulette-wrapper').offsetWidth;
                tape.style.transform = "translateX(" + (-(prizeIndex * cardWidth) + (wrapperWidth / 2) - (cardWidth / 2)) + "px)";
            }, 50);
            setTimeout(function() {
                inventory[prizeKaren.id] = (inventory[prizeKaren.id] || 0) + 1;
                updateUI();
                showModal(prizeKaren);
                document.getElementById('spin-btn').disabled = false;
            }, 4100);
        }

        function showModal(karen) {
            document.getElementById('modal-content').className = "modal-content bg-" + karen.tier;
            document.getElementById('win-tier').innerText = karen.tier.toUpperCase();
            document.getElementById('win-img').src = karen.img;
            document.getElementById('win-name').innerText = karen.name;
            document.getElementById('win-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('win-modal').style.display = 'none';
        }

        function adminClick() {
            adminClicks++;
            if (adminClicks >= 5) {
                document.getElementById('admin-panel').style.display = 'block';
            }
        }

        function addSpins() {
            balance += 100;
            updateUI();
        }

        function clearInv() {
            inventory = {};
            updateUI();
        }

        function toggleCheat() {
            cheatActive = !cheatActive;
            document.getElementById('cheat-status').innerText = cheatActive ? 'ВКЛ' : 'ВЫКЛ';
        }
    </script>
</body>
</html>
